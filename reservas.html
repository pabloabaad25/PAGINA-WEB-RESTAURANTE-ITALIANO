<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel & Pasta | Reserva tu Mesa </title>
    <link rel="stylesheet" href="css/styles.css">

</head>

<body>

    <!-- TOPBAR -->
    <header class="topbar">
        <div class="logo-container">
            <img src="img/logo restaurante.png" alt="logo restaurante" class="logo-img">
            <h1>PIXEL <span>&</span> PASTA</h1>

        </div>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html" class="active">INICIO</a></li>
                <li><a href="carta.html">CARTA</a></li>
                <li><a href="reservas.html">¡RESERVA!</a></li>
                <li><a href="sobrenosotros.html">NOSOTROS</a></li>

            </ul>
        </nav>
    </header>

    <div class="layout-wrapper">
        <aside class="sidebar">
            <h3>PROTOCOLOS</h3>
            <p>Las reservas se confirman en tiempo real por nuestra IA de sala.</p>
    </div>
    </aside>

    <main class="main-content">
        <section class="reservation-form-container">
            <h2 class="section-title">SOLICITAR ACCESO A MESA</h2>

            <form id="reserva-form" class="tech-form">
                <div class="form-group">
                    <label for="nombre">NOMBRE DEL USUARIO</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej. Pablo" required>
                </div>

                <div class="form-group">
                    <label for="email">EMAIL DE CONTACTO</label>
                    <input type="email" id="email" name="email" placeholder="usuario@red.com" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="comensales">COMENSALES</label>
                        <input type="number" id="comensales" name="comensales" min="1" max="12" value="2">
                    </div>
                    <div class="form-group">
                        <label for="fecha">FECHA</label>
                        <input type="date" id="fecha" name="fecha" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="hora">HORA DE ENTRADA</label>
                    <input type="time" id="hora" name="hora" min="13:00" max="22:30" required>
                </div>

                <button type="submit" class="btn-neon" id="btn-reservar">CONFIRMAR RESERVA</button>
            </form>

            <!-- Contenedor para el mensaje de éxito (oculto por defecto) -->
            <div id="mensaje-exito" class="hidden-msg">
                <div class="success-content">
                    <h3>¡RESERVA PROCESADA!</h3>
                    <p id="confirmacion-texto"></p>
                    <button onclick="location.reload()" class="btn-neon small">NUEVA RESERVA</button>
                </div>
            </div>
        </section>
    </main>
    </div>

    <footer>
        <p>&copy; <time datetime="2026">2026</time> Pixel & Pasta. <time id="reloj-digital"></time></p>
    </footer>

    <script src="js/main.js"></script>
</body>

</html>
